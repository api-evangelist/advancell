aid: advancell
name: AdvanCell
description: >-
  AdvanCell is a vertically integrated, clinical-stage radiopharmaceutical company developing targeted
  alpha therapies (TAT) for cancer, built around lead-212 (Pb-212) alpha-emitting isotopes and a
  proprietary, scalable isotope production and supply chain. Its lead candidate, 212Pb-ADVC001, is in
  clinical development for metastatic prostate cancer, and the company operates GMP radiochemistry and
  sterile manufacturing capability across Sydney, Brisbane (Translational Research Institute and
  Richlands) and Adelaide in Australia, with a global headquarters established in the Greater Boston
  area. AdvanCell is a private, venture-backed biotechnology company; it publishes no public developer
  program, API, or machine-readable API contract.
